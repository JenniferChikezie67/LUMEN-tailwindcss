<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <script>

        // First, check if the local storage have a variable called 'theme'
        if (localStorage.theme == undefined || localStorage.theme == '') {
            /**
             * Get the system default theme if is dark 
             * (note: the code below will return true if the system is in dark mode, otherwise false)
            */
            let isSystemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (isSystemDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } else {
            // if the is theme, get the current theme and use it on the website
            let currentTheme = localStorage.getItem('theme');
            if (currentTheme == 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }
    </script>
</head>

<body class="bg-primary-bg">

        <button class="p-4 cursor-pointer" onclick="toggleMode('dark')">
